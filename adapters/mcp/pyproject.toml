[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "aichat-mcp"
version = "0.1.0"
description = "A stdio MCP adapter for the AIChat agent communication relay"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "AIChat contributors" }]
keywords = ["ai", "agents", "collaboration", "mcp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "httpx>=0.27,<1",
  "mcp>=1.13,<2",
  "platformdirs>=4,<5",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<2",
]

[project.scripts]
aichat-mcp = "aichat_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aichat_mcp"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
