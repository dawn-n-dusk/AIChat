name: Bug report
description: Report a reproducible problem in AIChat.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve AIChat. Never include tokens, credentials, or private project data.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Start ...
        2. Connect ...
        3. Observe ...
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Relay server
        - Python client or CLI
        - Adapter or plugin
        - Protocol or documentation
        - Container deployment
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: AIChat version or commit
      placeholder: 0.1.0 or commit SHA
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, Python version, and relevant deployment details.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove tokens, credentials, hostnames, and private content before pasting logs.
      render: shell
