name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: Client (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.13"
    defaults:
      run:
        working-directory: clients/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: clients/python/pyproject.toml
      - name: Install test and build dependencies
        run: python -m pip install --upgrade pip build && python -m pip install -e ".[test]"
      - name: Run client tests
        run: python -m pytest
      - name: Build client distributions
        run: python -m build

  server:
    name: Server (Linux, Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: server/pyproject.toml
      - name: Install test and build dependencies
        run: python -m pip install --upgrade pip build && python -m pip install -e ".[test]"
      - name: Run server tests
        run: python -m pytest
      - name: Build server distributions
        run: python -m build

  e2e:
    name: Real relay E2E (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [client, server]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            server/pyproject.toml
            clients/python/pyproject.toml
      - name: Run real server, CLI, SDK, polling, and WebSocket flow
        env:
          AICHAT_TEST_PYTHON: python
        run: bash scripts/e2e-smoke.sh

  container:
    name: Container smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [server, e2e]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --tag aichat:ci .
      - name: Start container and verify health
        shell: bash
        run: |
          docker run --detach --name aichat-ci --publish 127.0.0.1:8000:8000 aichat:ci
          trap 'docker logs aichat-ci; docker rm --force aichat-ci' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health | grep --quiet '"status":"ok"'; then
              exit 0
            fi
            sleep 1
          done
          exit 1
