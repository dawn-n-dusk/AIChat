name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: Client (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.13"
    defaults:
      run:
        working-directory: clients/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: clients/python/pyproject.toml
      - name: Install test and build dependencies
        run: python -m pip install --upgrade pip build && python -m pip install -e ".[test]"
      - name: Run client tests
        run: python -m pytest
      - name: Build client distributions
        run: python -m build

  server:
    name: Server (Linux, Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: server/pyproject.toml
      - name: Install test and build dependencies
        run: python -m pip install --upgrade pip build && python -m pip install -e ".[test]"
      - name: Run server tests
        run: python -m pytest
      - name: Build server distributions
        run: python -m build

  raspberry-pi-package:
    name: Raspberry Pi deployment package (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate shell, Python, package, and rollback fixtures
        run: deploy/raspberry-pi/scripts/validate-package.sh

  windows-bootstrap:
    name: Windows bootstrap (PowerShell 5.1)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Windows package test dependency
        run: python -m pip install --upgrade pip pytest
      - name: Run Windows package static tests
        run: python -m pytest deploy/windows/tests/test_windows_package.py -q
      - name: Run protected bootstrap import with Windows PowerShell 5.1
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File deploy/windows/tests/test_import_bootstrap.ps1
      - name: Run Codex plugin MCP refresh regression with Windows PowerShell 5.1
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File deploy/windows/tests/test_plugin_mcp_autoload.ps1
      - name: Run real-state recovery chain with Windows PowerShell 5.1
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File deploy/windows/tests/test_recovery_real_state_e2e.ps1
      - name: Run protected transaction recovery regression with Windows PowerShell 5.1
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File deploy/windows/tests/test_transaction_recovery.ps1
      - name: Run recovery JSON contract E2E with Windows PowerShell 5.1
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File deploy/windows/tests/test_recovery_json_contract.ps1
      - name: Run recovery JSON outer-runner E2E with Windows PowerShell 5.1
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File deploy/windows/tests/test_recovery_json_runner.ps1
      - name: Run protected-path read-only diagnostic with Windows PowerShell 5.1
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File deploy/windows/tests/test_recovery_protected_paths_diagnostics.ps1

  macos-connector-package:
    name: macOS connector package (macOS)
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate shell and Python entrypoints
        shell: bash
        run: |
          bash -n deploy/macos/scripts/install.sh
          bash -n deploy/macos/scripts/check.sh
          bash -n deploy/macos/scripts/rollback.sh
          bash -n deploy/macos/scripts/uninstall.sh
          python -m py_compile \
            deploy/macos/scripts/launcher.py \
            deploy/macos/scripts/operation-lock.py \
            deploy/macos/scripts/render-plist.py \
            deploy/macos/scripts/staged-package.py
      - name: Run launcher-to-core configuration regression
        run: python -m unittest discover -s deploy/macos/tests -v

  mcp-adapter:
    name: MCP adapter (Linux, Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: adapters/mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.14"
          enable-cache: true
          cache-dependency-glob: adapters/mcp/uv.lock
      - name: Install locked test dependencies
        run: uv sync --locked --extra test
      - name: Run MCP adapter tests
        run: uv run --locked --extra test python -m pytest
      - name: Build MCP adapter distributions
        run: uv build

  node-adapters:
    name: ${{ matrix.adapter }} (Node 20)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        adapter:
          - claude-channel
          - codex-connector
          - grok-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: adapters/${{ matrix.adapter }}/package-lock.json
      - name: Install locked dependencies
        run: npm ci
        working-directory: adapters/${{ matrix.adapter }}
      - name: Run adapter tests
        run: npm test
        working-directory: adapters/${{ matrix.adapter }}

  e2e:
    name: Real relay E2E (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [client, server]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            server/pyproject.toml
            clients/python/pyproject.toml
      - name: Run real server, CLI, SDK, polling, and WebSocket flow
        env:
          AICHAT_TEST_PYTHON: python
        run: bash scripts/e2e-smoke.sh

  container:
    name: Container smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [server, e2e]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --tag aichat:ci .
      - name: Start container and verify health
        shell: bash
        run: |
          docker run --detach --name aichat-ci --publish 127.0.0.1:8000:8000 aichat:ci
          trap 'docker logs aichat-ci; docker rm --force aichat-ci' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health | grep --quiet '"status":"ok"'; then
              exit 0
            fi
            sleep 1
          done
          exit 1
